<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>blockquilt</title>
  <link rel="stylesheet" href="blockquilt.css">
  <link rel="stylesheet" href="blockquilt-content.css">
</head>
<body class="bg-stone-100">
  <!-- Exemple d'intégration : un élément, deux scripts, un appel à Blockquilt.mount. -->
  <div id="editor" class="mx-auto min-h-dvh max-w-3xl bg-white sm:my-6 sm:min-h-0 sm:overflow-clip sm:rounded-3xl sm:border sm:border-stone-200 sm:shadow-xl"></div>

  <!-- Document de démo (remplacé par le dernier enregistrement par dev/server.js). -->
  <textarea id="source" hidden>---
title: Arrivée
icon: 🏡
---

&gt; [!tip]
&gt; Garez-vous à gauche du portail.

- porte bleue
- code **1515**

## Garage

La clé est dans la boîte aux lettres.
Réseau : maison-wifi

&gt; [!info] 🥖 Boulangerie
&gt; La boulangerie du village ouvre à 7 h.

&gt; [!warning]
&gt; Ne pas fumer dans la maison.</textarea>

  <script src="blockquilt.js"></script>
  <script src="blockquilt-editor.js"></script>
  <script>
    window.editor = Blockquilt.mount(document.getElementById('editor'), {
      source: document.getElementById('source').value,
      media: 'media/',
      saveUrl: 'api/save',
      uploadUrl: 'api/upload',
      previewUrl: 'api/preview',
      fields: { _csrf: 'demo' },
      html: true,
      aiUrl: 'api/ai',
    });
  </script>
</body>
</html>
