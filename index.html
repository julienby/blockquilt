# Bienvenue dans blockquilt

:::t2
Écrire pour le web, bloc par bloc.
:::

blockquilt est un éditeur **par blocs** : chaque bloc a un sens, et tout reste du *Markdown* lisible. Essayez de ++fusionner++ deux blocs, d'en ==glisser== un par sa poignée, ou d'ouvrir le menu « ⋯ ».

## Les blocs de texte

:::t1
3 tailles de texte
:::

:::t3
T1, T2 et T3 ont la taille d'un titre, sans en être un.
:::

### Listes

- une puce
- une autre, avec un [lien](https://github.com)

1. Ouvrir le menu d'ajout
2. Choisir un type
3. Écrire

> Le texte est la source : ce que vous voyez est enregistré en Markdown, sans perte.

## Les encadrés

> [!info]
> Une information utile. Sélectionnez un mot pour le mettre en forme.

> [!tip] 💡 Astuce
> Touchez l'icône d'un encadré pour en choisir une autre.

> [!success]
> Ctrl+S enregistre, Ctrl+Z annule, Ctrl+Y rétablit.

> [!warning] ⚠️ Attention
> Un bloc supprimé se récupère avec « Annuler ».

> [!danger]
> Le bloc HTML est filtré : pas de script, pas de style.
